[metadata]
name = network-scanner
version = 2.0.0
author = Hugh Knight
author_email = hugh.knight.oce@gmail.com
description = A comprehensive network diagnostic tool for detecting live hosts and open ports
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/HughKnightOCE/NetworkScanner
project_urls =
    Bug Tracker = https://github.com/HughKnightOCE/NetworkScanner/issues
    Documentation = https://github.com/HughKnightOCE/NetworkScanner/blob/main/README.md
    Source Code = https://github.com/HughKnightOCE/NetworkScanner
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    Intended Audience :: System Administrators
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9+
    Topic :: System :: Monitoring
    Topic :: System :: Networking

[options]
packages = find:
python_requires = >=3.9
install_requires =
    scapy>=2.5.0

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    network-scanner = src.network_scanner:main

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,venv,build,dist,.eggs
ignore = E203,W503,W504

[pylint]
[pylint.MASTER]
extension-pkg-allow-list = scapy

[pylint.FORMAT]
max-line-length = 100

[pylint.MESSAGES CONTROL]
disable = missing-docstring,too-many-arguments,protected-access
